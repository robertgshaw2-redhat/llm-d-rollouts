# Every pod of every version: the screener, not the pool, keeps a request inside one revision.
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: pdcanary
spec:
  appProtocol: http
  selector:
    matchLabels:
      llm-d.ai/guide: pdcanary
  targetPorts:
    - number: 8000
  endpointPickerRef:
    group: ""
    kind: Service
    name: pdcanary-router-epp
    port:
      number: 9002
