# Envoy in front of the EPPs: the client entrypoint (Service apx, port 80). For each request it
# asks one healthy EPP over ext_proc which vLLM pod to use, then proxies to that pod. Not rolled
# in this example. Config: config/envoy.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apx-proxy
  labels:
    app.kubernetes.io/name: apx-proxy
    app.kubernetes.io/part-of: apx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apx-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apx-proxy
        app.kubernetes.io/part-of: apx
    spec:
      terminationGracePeriodSeconds: 600
      containers:
      - name: envoy
        image: docker.io/envoyproxy/envoy@sha256:447f857a01460642ef08ca2ab51136a44b9101fc2fa6bca2d1ae534466fa62f5 # v1.38.4
        command: [/bin/sh, -c]
        args:
        - ulimit -n 524288 || ulimit -n $(ulimit -Hn); exec /usr/local/bin/envoy --service-node
          envoy-proxy --log-level warn --concurrency 8 --drain-strategy immediate
          --drain-time-s 60 -c /etc/envoy/envoy.yaml
        ports:
        - {name: http, containerPort: 8081}
        - {name: ready, containerPort: 19001}
        readinessProbe:
          httpGet: {path: /ready, port: 19001}
          periodSeconds: 5
          failureThreshold: 1
        resources:
          requests: {cpu: "2", memory: 1Gi}
          limits:   {memory: 4Gi}
        volumeMounts:
        - {name: config, mountPath: /etc/envoy, readOnly: true}
      volumes:
      - name: config
        configMap:
          name: apx-envoy
---
apiVersion: v1
kind: Service
metadata:
  name: apx
  labels:
    app.kubernetes.io/part-of: apx
spec:
  selector:
    app.kubernetes.io/name: apx-proxy
  ports:
  - {name: http, port: 80, targetPort: 8081}
