# The model servers: 4 aggregated vLLM pods, 1 H200 each, DeepSeek-V2-Lite-Chat. They are not
# rolled in this example; they are what the router keeps an (approximate) prefix-cache index of.
#
# Nothing here tells the router what is cached: no KV events, no snapshots. The approximate
# prefix-cache producer infers it from its own routing decisions (see config/epp.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apx-vllm
  labels:
    app.kubernetes.io/name: apx-vllm
    app.kubernetes.io/part-of: apx
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: apx-vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apx-vllm
        app.kubernetes.io/part-of: apx
        # The InferencePool selects on this.
        llm-d.ai/guide: apx
    spec:
      terminationGracePeriodSeconds: 150
      tolerations:
        - key: is_gpu
          operator: Exists
          effect: PreferNoSchedule
      containers:
        - name: vllm
          # vllm/vllm-openai:nightly-5d35ce3934a7804b298559d2d99eec33792e1eb9 (2026-10-27), the same
          # image as examples 01 and 02, unmodified.
          image: docker.io/vllm/vllm-openai@sha256:3431ebee919296f7a5f3604db353f639e1474a4c7ef37595e31de6699fd831a7
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |-
              set -euo pipefail
              # --enable-prompt-tokens-details: usage.prompt_tokens_details.cached_tokens, which
              #   loadgen.py reads to tell a prefix-cache hit from a miss.
              exec vllm serve "${MODEL}" \
                --port 8000 \
                --served-model-name "${MODEL}" \
                --trust-remote-code \
                --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                --max-model-len 16384 \
                --gpu-memory-utilization 0.85 \
                --enable-prompt-tokens-details \
                --shutdown-timeout 90
          env:
            - name: MODEL
              value: deepseek-ai/DeepSeek-V2-Lite-Chat
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: HF_HUB_CACHE
              value: /var/cache/huggingface
            - name: VLLM_CACHE_ROOT
              value: /var/cache/vllm/vllm
            - name: FLASHINFER_WORKSPACE_BASE
              value: /var/cache/vllm/flashinfer
            - name: CUDA_CACHE_PATH
              value: /var/cache/vllm/cuda
            # Longer than Envoy's 4 s upstream idle timeout, so Envoy always closes an idle
            # connection first and never sends a request on one vLLM is closing.
            - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
              value: "120"
            - name: DO_NOT_TRACK
              value: "1"
          ports:
            - {name: http, containerPort: 8000, protocol: TCP}
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"
            limits:
              memory: 64Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 360
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - {name: dshm, mountPath: /dev/shm}
            - {name: hf-cache, mountPath: /var/cache/huggingface}
            - {name: jit-cache, mountPath: /var/cache/vllm}
      volumes:
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 8Gi}
        # CoreWeave node-local NVMe: weights and JIT kernels are paid for once per node.
        - name: hf-cache
          hostPath: {path: /mnt/local/hf-cache, type: DirectoryOrCreate}
        - name: jit-cache
          hostPath: {path: /mnt/local/jit-cache, type: DirectoryOrCreate}
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: apx
  labels:
    app.kubernetes.io/part-of: apx
spec:
  appProtocol: http
  selector:
    matchLabels:
      llm-d.ai/guide: apx
  targetPorts:
    - number: 8000
  endpointPickerRef:
    group: ""
    kind: Service
    name: apx-epp
    port:
      number: 9002
