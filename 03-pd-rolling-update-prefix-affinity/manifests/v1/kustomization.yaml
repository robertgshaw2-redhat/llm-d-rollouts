# Version v1 of pdroll: --max-num-seqs 128. Applying it over v0 is the rollout.
#
#   kubectl apply -n $NS -k manifests/v1
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

patches:
  - target:
      kind: DisaggregatedSet
      name: pdroll
    patch: |-
      # roles/0 is prefill, roles/1 is decode.
      - {op: test, path: /spec/roles/0/name, value: prefill}
      - {op: test, path: /spec/roles/1/name, value: decode}
      - {op: test, path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/0/name, value: ROLLOUT_VERSION}
      - {op: test, path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/1/name, value: MAX_NUM_SEQS}
      - {op: test, path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/0/name, value: ROLLOUT_VERSION}
      - {op: test, path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/1/name, value: MAX_NUM_SEQS}

      - {op: replace, path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/metadata/labels/rollout.example~1version, value: v1}
      - {op: replace, path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/metadata/labels/rollout.example~1version, value: v1}
      - {op: replace, path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/0/value, value: v1}
      - {op: replace, path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/0/value, value: v1}
      - {op: replace, path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/1/value, value: "128"}
      - {op: replace, path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/1/value, value: "128"}
